name: CI

# Run on every push and pull request to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Also validates demo-data/ against the real Pydantic models, so the
      # public demo's fixtures cannot drift from the API schema.
      - name: Run tests (pytest + moto)
        run: pytest

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Compile-time half of the provider contract: both providers must
      # satisfy ScanProvider (frontend/src/data/contract.d.ts).
      - name: Typecheck the provider boundary
        run: npm run typecheck

      # Runtime half: equivalent inputs through both providers must produce the
      # same shapes, and DiffView must render real backend diff output.
      - name: Run tests (vitest)
        run: npm test

      - name: Build (API profile)
        run: npm run build

      - name: Build (public demo profile)
        run: npm run build:demo

      # The demo's isolation is a property of the artifact, not of a flag: the
      # API client is tree-shaken out because VITE_DEMO_MODE is a build-time
      # constant. One component importing `api/client.js` directly undoes that
      # silently, and the built bundle is the only place it shows. Building the
      # demo profile without inspecting the output verified nothing.
      - name: Verify the demo bundle carries no API client
        run: bash scripts/check-demo-bundle.sh

  docker:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t shut-it-down-aws-backend ./backend
