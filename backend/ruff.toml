# Ruff config for the backend. Fast linter + import checks.
line-length = 100
target-version = "py312"

[lint]
# pycodestyle errors/warnings, pyflakes, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI uses function calls (Depends/HTTPException) in defaults patterns
]

[lint.per-file-ignores]
# Tests intentionally trigger exceptions and use broad patterns.
"tests/*" = ["B017"]
